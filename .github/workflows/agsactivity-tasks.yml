name: AGS Activity background task tests

on:
  pull_request:
    paths:
      - 'agsactivity/**'
      - 'tests/test_agsactivity_tasks.py'
      - '.github/workflows/agsactivity-tasks.yml'
  push:
    branches: [main]
    paths:
      - 'agsactivity/**'
      - 'tests/test_agsactivity_tasks.py'
      - '.github/workflows/agsactivity-tasks.yml'

permissions:
  contents: read

jobs:
  task-lifecycle:
    name: Activity task regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile cog and test background task lifecycle
        run: |
          python -m compileall -q agsactivity
          python -m unittest discover -s tests -p 'test_agsactivity_tasks.py' -v
