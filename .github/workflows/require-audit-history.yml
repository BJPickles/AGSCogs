name: Require rolling audit log

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  audit-history-updated:
    name: audit-history-updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the rolling audit log changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "AUDIT_HISTORY.md"; then
            echo "Rolling audit log updated."
          else
            echo "::error::Every pull request must update AUDIT_HISTORY.md with a dated audit entry (even if no findings changed)."
            exit 1
          fi
