name: Housing Scraper Selenium safety tests

on:
  pull_request:
    paths:
      - 'agshousingscraper/**'
      - 'tests/test_housing_scraper_selenium.py'
      - '.github/workflows/housing-scraper-selenium.yml'
  push:
    branches: [main]
    paths:
      - 'agshousingscraper/**'
      - 'tests/test_housing_scraper_selenium.py'
      - '.github/workflows/housing-scraper-selenium.yml'

permissions:
  contents: read

jobs:
  selenium-safety:
    name: Selenium safety regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.15,<5'
      - name: Check Python syntax and Selenium cleanup
        run: |
          python -m compileall -q agshousingscraper
          python -m unittest discover -s tests -p 'test_housing_scraper_selenium.py' -v
