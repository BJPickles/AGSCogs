name: AGS Profiles dependency contracts

on:
  pull_request:
    paths:
      - 'agsprofiles/**'
      - 'tests/test_agsprofiles_dependencies.py'
      - '.github/workflows/agsprofiles-dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'agsprofiles/**'
      - 'tests/test_agsprofiles_dependencies.py'
      - '.github/workflows/agsprofiles-dependencies.yml'

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared Python runtime packages
        run: python -m pip install 'pydantic>=2.11,<2.12' 'Pillow>=9.5'
      - name: Verify runtime imports and dependency contracts
        run: |
          python -c 'from pydantic import BaseModel; from PIL import Image; print("Declared packages import successfully")'
          python -m unittest discover -s tests -p 'test_agsprofiles_dependencies.py' -v
