name: AGS Profiles command registration

on:
  pull_request:
    paths:
      - 'agsprofiles/**'
      - 'tests/test_agsprofiles_registration.py'
      - '.github/workflows/agsprofiles-registration.yml'
  push:
    branches: [main]
    paths:
      - 'agsprofiles/**'
      - 'tests/test_agsprofiles_registration.py'
      - '.github/workflows/agsprofiles-registration.yml'

permissions:
  contents: read

jobs:
  registration:
    name: registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-time command framework
        run: python -m pip install 'discord.py>=2.3,<3'
      - name: Run command-registration regression tests
        run: python -m unittest discover -s tests -p 'test_agsprofiles_registration.py' -v
