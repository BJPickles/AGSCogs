name: Daily Dad Joke delivery tests

on:
  pull_request:
    paths:
      - 'agsdailydadjoke/**'
      - 'tests/test_dadjoke_delivery.py'
      - '.github/workflows/dadjoke-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'agsdailydadjoke/**'
      - 'tests/test_dadjoke_delivery.py'
      - '.github/workflows/dadjoke-delivery.yml'

permissions:
  contents: read

jobs:
  delivery:
    name: Scheduled posting regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile cog and test posting / retry semantics
        run: |
          python -m compileall -q agsdailydadjoke
          python -m unittest discover -s tests -p 'test_dadjoke_delivery.py' -v
